name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          functions=(
            place-order
            admin-provider-action
            datahub-webhook
            payment-lookup
            swiftdata-webhook
            paystack-verify
            paystack-process
            paystack-initiate
            paystack-webhook
            admin-resolve-payment
            theteller-initiate
            theteller-process
            theteller-verify
            theteller-webhook
            send-campaign-sms
            crm-manage
            wallet-pay
            auth-sms-webhook
            paystack-reconcile
            paystack-resolve
            activate-agent
            admin-convert-agent
            admin-delete-user
            admin-make-admin
            admin-user-manage
            debug-db
            process-withdrawal
            request-withdrawal
          )
          failed=()
          for fn in "${functions[@]}"; do
            echo "::group::Deploy $fn"
            if ! supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --no-verify-jwt; then
              failed+=("$fn")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to deploy: ${failed[*]}"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set provider secrets
        run: |
          supabase secrets set \
            DEVELOPER_API_KEY=${{ secrets.DEVELOPER_API_KEY }} \
            DEVELOPER_API_BASE_URL=https://lsocdjpflecduumopijn.supabase.co/functions/v1/developer-api \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
